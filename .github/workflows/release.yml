name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH.'
          }
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: qt-cache
        with:
          path: build/deps
          key: qt-${{ runner.os }}-${{ runner.arch }}-vs2022-${{ hashFiles('tools/build-qt.ps1') }}
          # Migrate the existing VS 2022 cache without another Qt rebuild.
          restore-keys: qt-${{ runner.os }}-${{ runner.arch }}-20260907.297.1-${{ hashFiles('tools/build-qt.ps1') }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.ref == 'refs/heads/main'
        with:
          node-version: '24'

      - name: Release from commits
        if: github.ref == 'refs/heads/main'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts semantic-release@25.0.9 @semantic-release/exec@7.1.0 conventional-changelog-conventionalcommits@8.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Release tooling installation failed.' }
          npx --no-install semantic-release
          if ($LASTEXITCODE -ne 0) { throw 'Automatic release failed.' }

      - name: Build tagged release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./build.ps1 -Version $env:RELEASE_VERSION
          ./tools/package.ps1

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --generate-notes --title "Fast Palette $env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $env:RELEASE_TAG dist/FastPalette.exe build/package/FastPalette.exe.sha256 build/FastPalette-relink-kit.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Preserve Qt cache
        if: always() && steps.qt-cache.outputs.cache-hit != 'true' && hashFiles('build/deps/qt-static/lib/cmake/Qt6/Qt6Config.cmake') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/deps
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
